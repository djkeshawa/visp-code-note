name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check extension, webviews and tests
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run compile

  package:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Package extension
        run: npx --yes @vscode/vsce package --out visp-notes.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: visp-notes-vsix
          path: visp-notes.vsix
          if-no-files-found: error
